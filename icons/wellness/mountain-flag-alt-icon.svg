    <path d="M -30,30 C -24,36 -14,38 -8,38" fill="none" stroke="#C8C2B8" stroke-width="3" stroke-linecap="round" opacity="0.8" style="fill:none;stroke:rgb(200, 194, 184);color:rgb(255, 255, 255);stroke-width:3px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.8;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <!-- Snow base drip right -->
    <path d="M 30,30 C 24,36 14,38 8,38" fill="none" stroke="#C8C2B8" stroke-width="3" stroke-linecap="round" opacity="0.8" style="fill:none;stroke:rgb(200, 194, 184);color:rgb(255, 255, 255);stroke-width:3px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.8;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Flagpole -->
    <line x1="0" y1="-110" x2="0" y2="-188" stroke="#2C2C2C" stroke-width="5" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(44, 44, 44);color:rgb(255, 255, 255);stroke-width:5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Flag fill -->
    <path d="M0,-188 C24,-176 54,-162 62,-145 C50,-130 22,-127 0,-138 Z" fill="#8B5E3C" stroke="#3D3535" stroke-width="4" stroke-linejoin="round" style="fill:rgb(139, 94, 60);stroke:rgb(61, 53, 53);color:rgb(255, 255, 255);stroke-width:4px;stroke-linecap:butt;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Flag highlight -->
    <path d="M4,-182 C20,-173 40,-163 46,-150" fill="none" stroke="#C4906A" stroke-width="2.5" stroke-linecap="round" opacity="0.6" style="fill:none;stroke:rgb(196, 144, 106);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  </g>
